palette = "catppuccin_mocha"
add_newline = true

format = """
$username$hostname $directory $git_branch $cmd_duration
$shell $character
"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[shell]
disabled = false
format = '[$indicator]($style)'
style = "fg:peach"

[username]
show_always = true
format = "[$user]($style)"
style_user = "lavender"
style_root = "red"

[hostname]
ssh_only = false
format = "[@$hostname]($style)"
style = "mauve"

[directory]
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
style = "teal"
format = "[$path]($style)"

[git_branch]
style = "fg:yellow"
format = "[($branch)]($style)"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[cmd_duration]
show_milliseconds = false
format = " $duration"
# style = "fg:green"
disabled = false
